title: BioMedGPS Documentation
email: yjcyxky@163.com
description: >-
  BioMedGPS is a knowledge graph platform with graph neural networks for drug repurposing and disease mechanism discovery.
  This documentation provides comprehensive guides for users to understand and use the platform effectively.

baseurl: "/biomedgps-docs/biomedgps" # the subpath of your site, e.g. /blog
url: "https://open-prophetdb.github.io" # the base hostname & protocol for your site, e.g. http://example.com

github_username: yjcyxky
repository: yjcyxky/biomedgps

# Build settings
markdown: kramdown
highlighter: rouge
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Navigation
header_pages:
  - getting-started.md
  - user-guide.md
  - features.md
  - api-reference.md
  - faq.md

# Collections
collections:
  guides:
    output: true
    permalink: /:collection/:name/
  features:
    output: true
    permalink: /:collection/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "guides"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "features"
    values:
      layout: "page"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Kramdown settings
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false